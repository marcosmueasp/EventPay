server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: identity
          uri: http://${IDENTITY_HOST:localhost}:8081
          predicates:
            - Path=/auth/**
          # Sin filtros ni reescritura: lo que entra es lo que llega a identity.

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
    register-with-eureka: true
    fetch-registry: true

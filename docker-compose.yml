services:
  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users-db
      POSTGRES_USER: eventpay
      POSTGRES_PASSWORD: eventpay
    ports:
      - "5433:5432"
    volumes:
      - pg-users:/var/lib/postgresql/data

  postgres-booking:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking-db
      POSTGRES_USER: eventpay
      POSTGRES_PASSWORD: eventpay
    ports:
      - "5434:5432"
    volumes:
      - pg-booking:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: eventpay-kraft-01
    ports:
      - "9092:9092"
      - "29092:29092"

  eureka:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    ports:
      - "8761:8761"
    depends_on:
      - kafka

  # Esqueleto D2-D4: se activa cuando exista el módulo.
  gateway:
    build:
      context: .
      dockerfile: ./gateway-service/Dockerfile
    ports: ["8080:8080"]
    environment:
      IDENTITY_HOST: identity
      EUREKA_HOST: eureka
    depends_on: [identity, eureka]
    restart: unless-stopped
  identity:
    build:
      context: .
      dockerfile: ./identity-service/Dockerfile
    ports: ["8081:8081"]
    environment:
      DB_HOST: postgres-users
      DB_PORT: 5432
      EUREKA_HOST: eureka
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET con al menos 32 caracteres antes de levantar}
    depends_on: [postgres-users, eureka]
    restart: unless-stopped
  # booking:
  #   build: ./booking-service
  #   ports: ["8082:8082"]
  #   depends_on: [postgres-booking, kafka, eureka]

volumes:
  pg-users: {}
  pg-booking: {}

services:
  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users-db
      POSTGRES_USER: eventpay
      POSTGRES_PASSWORD: eventpay
    ports:
      - "5433:5432"
    volumes:
      - pg-users:/var/lib/postgresql/data

  postgres-booking:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking-db
      POSTGRES_USER: eventpay
      POSTGRES_PASSWORD: eventpay
    ports:
      - "5434:5432"
    volumes:
      - pg-booking:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: eventpay-kraft-01
    ports:
      - "9092:9092"
      - "29092:29092"

  eureka:
    build: ./eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - kafka

  # Esqueleto D1-D4: se activan cuando existan los módulos.
  # gateway:
  #   build: ./gateway-service
  #   ports: ["8080:8080"]
  #   depends_on: [eureka, kafka]
  # identity:
  #   build: ./identity-service
  #   ports: ["8081:8081"]
  #   depends_on: [postgres-users, eureka, kafka]
  # booking:
  #   build: ./booking-service
  #   ports: ["8082:8082"]
  #   depends_on: [postgres-booking, kafka, eureka]

volumes:
  pg-users: {}
  pg-booking: {}
